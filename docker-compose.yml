services:
  portfolio:
    build: .
    environment:
      - NODE_ENV=production
      - NEXT_PUBLIC_BASE_URL=https://orlov.tech
    restart: unless-stopped

  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - portfolio
    restart: unless-stopped
